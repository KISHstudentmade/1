.search-btn span { font-size:12px; }

.search-panel { padding:10px 16px; background:#13222f; border-bottom:1px solid #ffffff10; display:none; z-index:9; flex-shrink:0; }
.search-panel.show { display:block; }
.search-panel input { width:100%; padding:10px 14px; background:#1a2d3d; border:1px solid #ffffff15; border-radius:10px; color:#fff; font-size:14px; outline:none; font-family:inherit; }
.search-results { max-height:200px; overflow-y:auto; margin-top:8px; border-radius:10px; background:#1a2d3d; border:1px solid #ffffff10; }
.search-results:empty { display:none; }
.search-item { padding:10px 14px; cursor:pointer; border-bottom:1px solid #ffffff08; display:flex; align-items:center; gap:10px; font-size:13px; }
.search-item:hover { background:#ffffff08; }
.search-item .icon { font-size:16px; }
.search-item .name { font-weight:600; }
.search-item .loc { font-size:11px; color:#6b7c8d; }
.no-result { font-size:12px; color:#6b7c8d; text-align:center; padding:12px; display:none; }

.building-tabs { display:flex; padding:10px 16px 0; gap:8px; flex-shrink:0; }
.building-tab { flex:1; padding:10px; background:#ffffff08; border:1px solid #ffffff12; border-radius:12px; color:#8899aa; font-weight:500; font-size:14px; cursor:pointer; font-family:inherit; transition:all .25s; }
.building-tab.active { background:linear-gradient(135deg,#4A90D9,#5a6fd9); border:none; color:#fff; font-weight:700; }
.building-tab small { display:block; font-size:9px; margin-top:2px; opacity:.7; font-weight:400; }

.floor-tabs { display:flex; padding:10px 16px; gap:6px; overflow-x:auto; flex-shrink:0; }
.floor-tab { padding:7px 16px; background:#ffffff08; border:1px solid #ffffff12; border-radius:20px; color:#8899aa; font-weight:400; font-size:13px; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .2s; font-family:inherit; }
.floor-tab.active { background:#7B61FF; border-color:#7B61FF; color:#fff; font-weight:700; }

.map-area { flex:1; position:relative; overflow:hidden; margin:0 12px 8px; border-radius:16px; background:#0d1820; border:1px solid #ffffff10; touch-action:none; }
.map-area svg { width:100%; height:100%; transition:transform .2s ease; }
.map-area svg.dragging { transition:none; }

.room-rect { cursor:pointer; transition:all .2s; }
.room-rect:hover { filter:brightness(1.3); }

.zoom-controls { position:absolute; bottom:14px; right:14px; display:flex; flex-direction:column; gap:6px; z-index:5; }
.zoom-btn { width:36px; height:36px; border-radius:10px; background:#1a2d3d; border:1px solid #ffffff15; color:#c0d0e0; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }

.info-panel { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(to top,#13222ffa,#13222ff0); backdrop-filter:blur(20px); border-radius:20px 20px 0 0; padding:20px; z-index:20; transform:translateY(100%); transition:transform .3s ease; }

.info-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }

.legend { display:flex; flex-wrap:wrap; gap:6px 12px; padding:4px 16px 10px; justify-content:center; flex-shrink:0; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:#6b7c8d; }

let curBuilding = "본관";
let curFloorIdx = 0;
let selectedRoom = null;
let scale = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0;
let lastTouchDist = 0, lastTouchScale = 1;

function init() {
  renderBuildingTabs();
  renderFloorTabs();
  renderMap();
}

function renderBuildingTabs() {
  const el = document.getElementById("buildingTabs");
  el.innerHTML = "";
  for (const b in DATA) {
    const btn = document.createElement("button");
    btn.className = "building-tab" + (b === curBuilding ? " active" : "");
    btn.innerHTML = b + "<small>" + DATA[b].nameVi + "</small>";
    btn.onclick = () => { curBuilding = b; curFloorIdx = 0; resetState(); renderBuildingTabs(); renderFloorTabs(); renderMap(); };
    el.appendChild(btn);
  }
}

function renderFloorTabs() {
  const el = document.getElementById("floorTabs");
  el.innerHTML = "";
  DATA[curBuilding].floors.forEach((f, i) => {
    const btn = document.createElement("button");
    btn.className = "floor-tab" + (i === curFloorIdx ? " active" : "");
    btn.textContent = f.label;
    btn.onclick = () => { curFloorIdx = i; resetState(); renderFloorTabs(); renderMap(); };
    el.appendChild(btn);
  });
}

function resetState() { scale = 1; panX = 0; panY = 0; selectedRoom = null; closeInfo(); }

function renderMap() {
  const svg = document.getElementById("mapSvg");
  const floor = DATA[curBuilding].floors[curFloorIdx];
  svg.setAttribute("viewBox", floor.vb);
  document.getElementById("floorLabel").textContent = curBuilding + " " + floor.label;
  updateTransform();

  let html = '<defs><pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 5 0 L 0 0 0 5" fill="none" stroke="#ffffff06" stroke-width="0.1"/></pattern></defs>';
  html += '<rect x="-10" y="-10" width="300" height="300" fill="url(#grid)"/>';

  floor.rooms.forEach(r => {
    const c = TYPES[r.type];
    const lines = r.label.split("\n");
    const fs = Math.min(r.w, r.h) < 10 ? 0.55 : 0.7;
    html += `<g class="room-rect" onclick="selectRoom('${r.id}')">`;
    html += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="0.8" fill="${c.color}18" stroke="${c.color}" stroke-width="0.3" data-id="${r.id}"/>`;
    lines.forEach((line, i) => {
      const ty = r.y + r.h/2 + (i - (lines.length-1)/2) * (fs*1.4);
      html += `<text x="${r.x+r.w/2}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="500" fill="#c8d6e5" style="pointer-events:none;font-family:Pretendard,sans-serif">${line}</text>`;
    });
    html += '</g>';
  });
  svg.innerHTML = html;
}

function selectRoom(id) {
  const floor = DATA[curBuilding].floors[curFloorIdx];
  const room = floor.rooms.find(r => r.id === id);
  if (!room) return;
  selectedRoom = room;

  // reset previous
  document.querySelectorAll("#mapSvg rect[data-id]").forEach(el => {
    const rid = el.getAttribute("data-id");
    const rm = floor.rooms.find(r => r.id === rid);
    if (rm) {
      const c = TYPES[rm.type];
      el.setAttribute("fill", c.color + "18");
      el.setAttribute("stroke-width", "0.3");
    }
  });

  // highlight selected
  const rect = document.querySelector(`rect[data-id="${id}"]`);
  if (rect) {
    const c = TYPES[room.type];
    rect.setAttribute("fill", c.color);
    rect.setAttribute("stroke-width", "0.6");
  }

  const c = TYPES[room.type];
  document.getElementById("infoIcon").textContent = c.icon;
  document.getElementById("infoIcon").style.background = c.color + "25";
  document.getElementById("infoName").textContent = room.label.replace(/\n/g, " ");
  document.getElementById("infoLoc").textContent = curBuilding + " " + floor.label + " · " + c.label;
  document.getElementById("infoPanel").style.borderTop = "2px solid " + c.color;
  document.getElementById("infoDesc").textContent = "설명이 아직 등록되지 않았습니다.";
  document.getElementById("infoPanel").classList.add("show");
}

function closeInfo() {
  document.getElementById("infoPanel").classList.remove("show");
  if (selectedRoom) {
    const rect = document.querySelector(`rect[data-id="${selectedRoom.id}"]`);
    if (rect) {
      const c = TYPES[selectedRoom.type];
      rect.setAttribute("fill", c.color + "18");
      rect.setAttribute("stroke-width", "0.3");
    }
    selectedRoom = null;
  }
}

function toggleSearch() {
  const panel = document.getElementById("searchPanel");
  const btn = document.getElementById("searchToggle");
  panel.classList.toggle("show");
  btn.classList.toggle("active");
  if (panel.classList.contains("show")) document.getElementById("searchInput").focus();
}

function doSearch(q) {
  const res = document.getElementById("searchResults");
  const noRes = document.getElementById("noResult");
  res.innerHTML = "";
  noRes.style.display = "none";
  if (!q.trim()) return;

  const query = q.toLowerCase().replace(/\s/g, "");
  const results = [];
  for (const bName in DATA) {
    DATA[bName].floors.forEach((f, fi) => {
      f.rooms.forEach(r => {
        const label = r.label.replace(/\n/g, "").toLowerCase().replace(/\s/g, "");
        if (label.includes(query) || r.id.toLowerCase().includes(query)) {
          results.push({...r, building: bName, floorLabel: f.label, floorIdx: fi});
        }
      });
    });
  }

  if (results.length === 0) { noRes.style.display = "block"; return; }

  results.forEach(r => {
    const div = document.createElement("div");
    div.className = "search-item";
    div.innerHTML = `<span class="icon">${TYPES[r.type].icon}</span><div><div class="name">${r.label.replace(/\n/g," ")}</div><div class="loc">${r.building} ${r.floorLabel}</div></div>`;
    div.onclick = () => {
      curBuilding = r.building;
      curFloorIdx = r.floorIdx;
      renderBuildingTabs();
      renderFloorTabs();
      renderMap();
      setTimeout(() => {
        selectRoom(r.id);
        scale = 1.5;
        panX = -(r.x - 40) * 1.5;
        panY = -(r.y - 20) * 1.5;
        updateTransform();
      }, 100);
      document.getElementById("searchInput").value = "";
      res.innerHTML = "";
      document.getElementById("searchPanel").classList.remove("show");
      document.getElementById("searchToggle").classList.remove("active");
    };
    res.appendChild(div);
  });
}

function updateTransform() {
  const svg = document.getElementById("mapSvg");
  svg.style.transform = `scale(${scale}) translate(${panX/scale}px,${panY/scale}px)`;
}

function zoomIn() { scale = Math.min(4, scale + 0.3); updateTransform(); }
function zoomOut() { scale = Math.max(0.5, scale - 0.3); updateTransform(); }
function resetView() { scale = 1; panX = 0; panY = 0; updateTransform(); closeInfo(); }

const mapArea = document.getElementById("mapArea");
mapArea.addEventListener("pointerdown", e => {
  if (e.target.closest(".zoom-btn")) return;
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
  document.getElementById("mapSvg").classList.add("dragging");
});
mapArea.addEventListener("pointermove", e => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  updateTransform();
});
mapArea.addEventListener("pointerup", () => { isDragging = false; document.getElementById("mapSvg").classList.remove("dragging"); });
mapArea.addEventListener("pointerleave", () => { isDragging = false; document.getElementById("mapSvg").classList.remove("dragging"); });
mapArea.addEventListener("wheel", e => { e.preventDefault(); scale = Math.min(4, Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15))); updateTransform(); }, {passive:false});

mapArea.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
    lastTouchScale = scale;
  }
}, {passive:true});
mapArea.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    scale = Math.min(4, Math.max(0.5, lastTouchScale * (dist / lastTouchDist)));
    updateTransform();
  }
}, {passive:false});

init();
</script>
